worker_processes auto;
events { worker_connections 1024; }
http {
    include mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    # Re-resolve Docker service names when containers are recreated with new IPs.
    upstream users_api { zone users 64k; server user-service:8000 resolve; }
    upstream courses_api { zone courses 64k; server course-service:8000 resolve; }
    upstream quizzes_api { zone quizzes 64k; server quiz-service:8000 resolve; }
    upstream payments_api { zone payments 64k; server payment-service:8000 resolve; }
    upstream frontend_app { zone frontend 64k; server frontend:80 resolve; }
    server {
        listen 80;
        server_name _;
        client_max_body_size 1m;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        location = /health {
            default_type application/json;
            return 200 '{"service":"gateway","status":"ok","scope":"gateway_only"}';
        }
        # Internal APIs must not be reachable through the public or diagnostic prefixes.
        location ~ ^/(internal|services/(users|courses|quizzes|payments)/internal)(/|$) { return 404; }
        # No URI suffix: keep the complete business path and query string.
        location ~ ^/api/users(/|$) { proxy_pass http://users_api; }
        location ~ ^/api/(languages|courses|lessons|enrollments)(/|$) { proxy_pass http://courses_api; }
        location ~ ^/api/quizzes(/|$) { proxy_pass http://quizzes_api; }
        location ~ ^/api/payments(/|$) { proxy_pass http://payments_api; }
        location /api/ {
            default_type application/json;
            return 404 '{"error":{"code":"route_not_found","message":"Unknown API route"}}';
        }
        # Only these prefixes are stripped; FastAPI ROOT_PATH repairs Swagger URLs.
        location /services/users/ { proxy_pass http://users_api/; }
        location /services/courses/ { proxy_pass http://courses_api/; }
        location /services/quizzes/ { proxy_pass http://quizzes_api/; }
        location /services/payments/ { proxy_pass http://payments_api/; }
        location / { proxy_pass http://frontend_app; }
    }
}
