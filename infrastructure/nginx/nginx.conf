worker_processes auto;
events { worker_connections 1024; }
http {
    include mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    upstream users_api { server user-service:8000; }
    upstream courses_api { server course-service:8000; }
    upstream quizzes_api { server quiz-service:8000; }
    upstream payments_api { server payment-service:8000; }
    upstream frontend_app { server frontend:80; }
    server {
        listen 80;
        server_name _;
        client_max_body_size 1m;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        location = /health {
            default_type application/json;
            return 200 '{"service":"gateway","status":"ok","scope":"gateway_only"}';
        }
        # No URI after proxy_pass: preserve the entire /api/... path and query.
        # Regex includes exact collection paths: POST never needs a slash redirect.
        location ~ ^/api/users(/|$) { proxy_pass http://users_api; }
        location ~ ^/api/(courses|enrollments)(/|$) { proxy_pass http://courses_api; }
        location ~ ^/api/quizzes(/|$) { proxy_pass http://quizzes_api; }
        location ~ ^/api/payments(/|$) { proxy_pass http://payments_api; }
        location /api/ { default_type application/json; return 404 '{"error":{"code":"route_not_found","message":"Unknown API route"}}'; }

        # Only diagnostic prefixes are stripped. ROOT_PATH repairs Swagger URLs.
        location /services/users/ { proxy_pass http://users_api/; }
        location /services/courses/ { proxy_pass http://courses_api/; }
        location /services/quizzes/ { proxy_pass http://quizzes_api/; }
        location /services/payments/ { proxy_pass http://payments_api/; }
        location / { proxy_pass http://frontend_app; }
    }
}
